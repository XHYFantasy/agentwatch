# ── T7 · 安全收口清单（声明式 · 全部宿主共用一份）────────────────────
#
# 一份清单，两处消费 —— 机制不同，内容同源：
#
#   ① 手机链路（web profile）—— 用 launcher 的 `--patch` 直接挂。
#      纯叠加、**不改 profile**、随时撤：
#
#         dsh web --patch "<本文件绝对路径>" --no-open --port 3081 --trusted-host <ts-ip>:3080
#
#      ⚠️ 顺序坑（2026-10-13 实测踩到）：`--patch` 是 **launcher** flag，必须排在
#         app 参数**之前**。放到 `--no-open` 后面会被当成 web 自己的参数 →
#         `error: unknown option '--patch'`。用法行 `dsh [--profile] <name>
#         [options] [app-args...]` 说的就是这个：[options] 是 launcher 的。
#
#   ② 桌面 GUI（desktop profile）—— **不能用 `--patch`**。
#      Electron 侧 `patchFiles: []` 是**写死的空数组**（属主源码
#      refs\dsh-desktop-host\lib\index.js:230，无环境变量、无 CLI 口子），
#      且 `dsh --profile desktop` 被官方硬拒（"managed exclusively by the
#      Electron application"，连 --dump-config 都不给）。
#      ⇒ 只能经 `tools\apply-host-patch.mjs` 合并进
#        `%DSH_HOME%\profiles\desktop\cordis.patch.yml`（**工作区外**）。
#      ⚠️ 那个文件里有用户的真实设置（ui-chat / agent-default-model / …），
#         所以脚本**只追加一个托管块、绝不碰原有条目**，且改前自动备份。
#
# ── 为什么落点是 profile 组合（别再找别的落点）────────────────────
#   `dsh web` 只有 4 个参数（--host/--no-open/--port/--trusted-host），
#   **没有任何认证或路径策略开关**；bridge(ts-bridge.mjs) 是纯 TCP 透传，
#   远程走 WebSocket 二进制流，在字节流里过滤字段既脆弱又不可靠 ⇒ 都不是。
#
# ── 关键概念：每个能力都有「UI 半」和「服务端半」──────────────────
#   只关 UI 半 = 入口消失、API 还开着 = **遮蔽，不是收口**。
#   行号取自 logs\web-dump-config.yml。
#
#   #1 终端      UI: ui-sidebar-terminal (541)   服务端: terminal-controller (461)
#   #2 文件      UI: ui-sidebar-files   (543)    服务端: workspace-files     (463)
#   #3 拉起应用  UI: ui-open-in-app     (441)    服务端: open-in-app         (435)
#   #4 工作区    UI: ui-workspace       (577)    服务端: workspace-controller(471)
#                                                     + directory-picker    (453)
#
# ── 本文件当前档位：③ 保守版（关 #1 全、#2 只关 UI 半）──────────────
#
#   🔴 #2 的服务端半 workspace-files **故意没关** —— P1 已验（2026-10-13），
#   「连它一起关」这条路**已被否决**，不再是「待办」。
#
#   实测（用 host-patch\p1-aggressive.tmp.yml 挂上去跑；同一 prompt、
#   点同一个链接 远程AI监看/AGENTS.md）：
#     · 基线（workspace-files 开）→ 点完 DOM +138 625 字节，右侧栏把
#       AGENTS.md 全文渲染出来
#     · 关掉（p1-aggressive）   → tab 照样开（标题 + MD 图标），正文只有
#       一行「文件资源服务不可用」，DOM 只 +2 855 字节（纯外壳）
#     证据截图：logs\p1-nofiles-preview.png
#
#   ⭐ 而且这是**纯损失**：它挡的是「读」，而读这条路**本来就被 agent
#   自己的 read 工具敞着**（T7.3 已闭环：dsh-fs-sandbox 明写「读取保持
#   不受约束」、config 无「读根」字段）—— 手机上直接让 agent 读
#   C:\Users\<用户名>\.dsh\.credentials.yaml 一直可行，关不关它都一样。
#   ⇒ 换不到安全增量，只丢掉「点开文件看内容」这条**看进度**。
#
#   ⚠️ 没有中间档：属主文档明写「bundle 中单个 workspace-files 条目供应
#   两面；Client 没有单独配置」，且它的 config 只有 maxBytes /
#   maxFileBytes / maxLines / maxEntries，**没有任何路径策略**。
#
#   ⇒ 下面那段注释掉的 workspace-files **不要启用**（留作记录）。
#
#   🔗 「它为什么牵着文件链接」的原文依据：
#     dsh-api-workspace-files/README.zh.md:77「浏览器导出向 ctx.resources
#     注册 file 提供方」；消费方 = ui-chat 的 openFile
#     （dsh-client-ui-chat/lib/client.js:12423-12427 造
#     dsh-resource://file/… 再 ctx.sidebarRight.openResource）+ 右侧栏
#     ui-sidebar-documentpreview（README.zh.md:83「文本预览声明其 Sidebar
#     行号导航参数」）。
#
#   #2 的性质（属主文档原文 dsh-api-workspace-files/README.zh.md）：
#     :12  「文件读取和监听**可以指向工作区外路径**；目录列举和监听仍限定于工作区。」
#     :40  「本服务**不额外要求文件读取限定于工作区**」
#     :54  「文件操作……**不做额外的工作区包含检查**」
#     :143 「**仅目录受限**——目录列举与监听限定在 Session 工作区内」
#   ⇒ 列举受限、读取不受限。这与 UI README 那句「Host 本来也拒绝工作区根
#     之外的路径」（说的是**树**）不矛盾。
#   ⇒ 所以 #2 只关 UI 半，确实只是遮蔽掉一个入口，**没有堵掉读路径**。

# ══ #1 交互式终端 —— 关（UI 半 + 服务端半）
# 为什么连服务端一起关：属主文档明写它**只服务用户交互式终端**
#（api-terminal-controller/README.zh.md:12「终端输出不进入 Agent 对话记录」、
#  :79「本包只处理用户交互式终端，不向模型请求添加内容」）
# ⇒ agent 干活用他自己的 pwsh-sandbox 工具，不走这里。
# ✅ 2026-10-13 实测：关掉后发消息 → agent 1 秒回「收到」，零报错。
# 权限性质（同 README :30）：「用户终端使用执行环境中系统用户的权限，
# **独立于 Agent 的沙箱模式和审批策略**」—— 这就是它性质独一份的原因。
- id: ui-sidebar-terminal
  name: "@deepseek-ai/dsh-client-ui-sidebar-terminal"
  disabled: true
- id: terminal-controller
  name: "@deepseek-ai/dsh-api-terminal-controller"
  disabled: true

# ══ #2 工作区文件 —— 只关 UI 半（服务端半见上面的说明，等 P1 结论）
- id: ui-sidebar-files
  name: "@deepseek-ai/dsh-client-ui-sidebar-files"
  disabled: true
